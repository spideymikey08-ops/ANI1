<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ani — Plots</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="plots.css">
    <link rel="stylesheet" href="../Chat/chat.css">
</head>
<body data-page="plots">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
 
        <main class="main">
            <header class="page-header header-top-bar">
                <div>
                 <h1>Plots</h1>
                    <p>Add new plots, edit existing ones, and manage what's currently planted.</p>
                </div>
 
                <div class="side-note header-user-wrap">
                    <div id="sidebarUser" class="side-user" hidden></div>
                    <a href="#" id="logoutBtn" class="logout-link">🚪 Logout</a>
                </div>
            </header>
 
            <section class="card">
                <div class="card-head">
                    <div>
                        <h2>Plot Overview</h2>
                        <p>A quick visual of every plot</p>
                    </div>
                    <button type="button" id="addPlotBtn">＋ Add Plot</button>
                </div>
 
                <div id="plotOverview" class="plot-grid"></div>
            </section>
 
            <!-- Add plot modal -->
            <div id="plotModal" class="modal" hidden>
                <div class="modal-box">
                    <button type="button" class="close" id="plotClose" aria-label="Close">×</button>
 
                    <h2>Add a New Plot</h2>
 
                    <form id="plotForm">
                        <label>
                            Plot Name
                            <input name="name" required placeholder="e.g. Plot B1">
                        </label>
 
                        <label>
                            Crop Type
                            <input type="hidden" name="crop_type" value="Rice">
                            <input value="Rice" readonly>
                        </label>
 
                        <label>
                            Status
                            <select name="status">
                                <option>Available</option>
                                <option>Occupied</option>
                                <option>Maintenance</option>
                            </select>
                        </label>
 
                        <button>＋ Add Plot</button>
                    </form>
                </div>
            </div>
                </div>
 
                <div id="plotOverview" class="plot-grid"></div>
            </section>
            <!-- Plot details modal (opens when a plot card is clicked) -->
            <div id="detailModal" class="modal" hidden>
                <div class="modal-box">
                    <button type="button" class="close" id="detailClose" aria-label="Close">×</button>
 
                    <h2>Plot Details</h2>
 
                    <div class="detail-form">
                        <label>
                            Plot Name
                            <input id="detailName">
                        </label>
 
                        <div class="form-row">
                            <label>
                                Crop Type
                                <input value="Rice" readonly>
                            </label>
 
                            <label>
                                Status
                                <select id="detailStatus">
                                    <option>Available</option>
                                    <option>Planted</option>
                                    <option>Maintenance</option>
                                </select>
                            </label>
                        </div>
 
                        <dl class="detail-list">
                            <div><dt>Current planting</dt><dd data-detail="planting"></dd></div>
                            <div><dt>Planted</dt><dd data-detail="planted"></dd></div>
                            <div><dt>Expected harvest</dt><dd data-detail="harvest"></dd></div>
                            <div><dt>Notes</dt><dd data-detail="notes"></dd></div>
                        </dl>
 
                        <div class="detail-actions">
                            <button type="button" id="detailSave">💾 Save</button>
                            <button type="button" class="small-btn" id="detailPlant">🌱 Edit</button>
                            <button type="button" class="small-btn danger" id="detailDelete">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
 
            <!-- Planting modal -->
            <div id="plantModal" class="modal" hidden>
                <div class="modal-box">
                    <button type="button" class="close" id="plantClose" aria-label="Close">×</button>
 
                    <h2>Planting — <span id="plantTitle"></span></h2>
 
                    <form id="plantForm">
                        <input type="hidden" name="plot_id">
                        <input type="hidden" name="planting_id">
 
                        <label>
                            Crop / Plant Name
                            <input type="hidden" name="crop_name" value="Rice">
                            <input value="Rice" readonly>
                        </label>
 
                        <label>
                            Variety
                            <input name="variety" placeholder="e.g. IR64">
                        </label>
 
                        <div class="form-row">
                            <label>
                                Planted Date
                                <input type="date" name="planted_date" required>
                            </label>
 
                            <label>
                                Expected Harvest
                                <input type="date" name="expected_harvest_date">
                            </label>
                        </div>
 
                        <label>
                            Notes
                            <textarea name="notes" placeholder="Optional notes"></textarea>
                        </label>
 
                        <button>＋ Save Planting</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
 
    <div id="toast" class="toast"></div>
 
    <template id="tpl-plot-card">
        <div class="plot-card">
            <strong data-field="name"></strong>
            <small data-field="crop"></small>
            <div>
                <span class="badge" data-badge="crop"></span>
                <span class="badge" data-badge="status"></span>
            </div>
        </div>
    </template>
 
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="plots.js"></script>
    <script src="../Chat/chat.js"></script>
</body>
</html>
