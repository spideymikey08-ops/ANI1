<!doctype html>
<html lang="en">
 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ani — Dashboard</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../Chat/chat.css">
</head>
 
<body data-page="dashboard">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
 
        <main class="main">
            <header class="page-header header-top-bar">
                <div>
                    <h1>Dashboard</h1>
                    <p>Here's what's happening across the rice plots today.</p>
                </div>
 
                <div class="side-note header-user-wrap">
                    <div id="sidebarUser" class="side-user" hidden></div>
                    <a href="#" id="logoutBtn" class="logout-link">🚪 Logout</a>
                </div>
            </header>
 
            <div id="dashError" class="error-box" hidden></div>
 
            <div class="stats">
                <div class="stat stat-green">
                    <span>Rice plots</span>
                    <b id="statRice">–</b>
                </div>
 
                <div class="stat stat-blue">
                    <span>To Do tasks today</span>
                    <b id="statTasks">–</b>
                </div>
 
                <div class="stat stat-gold">
                    <span>Harvests this week</span>
                    <b id="statHarvests">–</b>
                </div>
            </div>
 
            <div class="dash-grid">
                <section class="card dash-plots">
                    <h2>Plot Overview</h2>
                    <div class="plot-grid" id="plotGrid"></div>
                </section>
 
                <section class="card dash-watering">
                    <h2>To Do</h2>
                    <div id="taskList"></div>
                </section>
 
                <section class="card dash-harvest">
                    <h2>Recent Harvests</h2>
                    <div id="harvestList"></div>
                </section>
 
                <section class="card dash-seeds">
                    <h2>Seed Inventory</h2>
                    <div id="seedList"></div>
                </section>
            </div>
        </main>
    </div>
 
    <div id="toast" class="toast"></div>
 
    <template id="tpl-plot-card">
        <div class="plot-card">
            <strong data-field="name"></strong>
            <small data-field="crop"></small>
            <div>
                <span class="badge" data-badge="crop"></span>
                <span class="badge" data-badge="status"></span>
            </div>
        </div>
    </template>
 
    <template id="tpl-task-item">
        <div class="list-row">
            <span data-field="label"></span>
            <span class="badge" data-badge="state"></span>
        </div>
    </template>
 
    <template id="tpl-harvest-item">
        <div class="list-row">
            <span data-field="label"></span>
            <strong data-field="quantity"></strong>
        </div>
    </template>
 
    <template id="tpl-seed-item">
        <div class="list-row">
            <span data-field="name"></span>
            <strong>
                <span data-field="quantity"></span>
                <span class="badge low" data-role="low" hidden>Low</span>
            </strong>
        </div>
    </template>
 
    <template id="tpl-empty">
        <div class="empty" data-field="text"></div>
    </template>
 
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="dashboard.js"></script>
    <script src="../Chat/chat.js"></script>
</body>
 
</html>
